apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: food
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://app:app@postgres:5432/users"
          env:
            - name: DATABASE_URL
              value: postgresql://app:app@postgres:5432/users
            - name: OWNER_CODE
              valueFrom:
                secretKeyRef:
                  name: owner-secret
                  key: OWNER_CODE
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: food
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000