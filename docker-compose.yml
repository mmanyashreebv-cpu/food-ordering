services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      # -h 127.0.0.1 makes sure we only report "ready" after init finished
      test: ["CMD-SHELL", "pg_isready -U app -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-service:
    image: inventory-service:v1
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/inventory
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    image: user-service:v1
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/users
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    image: order-service:v1
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@postgres:5432/orders
      INVENTORY_URL: http://inventory-service:8000
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_started

volumes:
  pgdata: