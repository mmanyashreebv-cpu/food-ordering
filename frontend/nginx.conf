
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/users/ {
        proxy_pass http://user-service:8000/;
    }

    location /api/inventory/ {
        proxy_pass http://inventory-service:8000/;
    }

    location /api/orders/ {
        proxy_pass http://order-service:8000/;
    }
}
